<!DOCTYPE html>
<html>
<head>

<title>Donor Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #fdf2f2;
    background-image:
      radial-gradient(ellipse at 20% 20%, #fde0e0 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #fce4e4 0%, transparent 50%);
  }

  .box {
    background: white;
    padding: 40px 34px;
    width: 100%;
    max-width: 400px;
    border-radius: 20px;
    border: 1px solid #f0d4d4;
    box-shadow: 0 8px 32px rgba(198,40,40,0.10);
    text-align: center;
  }

  .icon {
    width: 60px; height: 60px;
    background: #c62828;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem;
    margin: 0 auto 20px;
    box-shadow: 0 6px 18px rgba(198,40,40,0.30);
  }

  h2 { font-size: 1.4rem; font-weight: 700; color: #b71c1c; margin-bottom: 6px; }
  .subtitle { font-size: 0.83rem; color: #aaa; margin-bottom: 26px; }

  .error {
    background: #fde8e8;
    color: #c62828;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.84rem;
    font-weight: 500;
    margin-bottom: 16px;
    text-align: left;
  }

  input {
    width: 100%;
    padding: 12px 15px;
    border: 1.5px solid #e8d0d0;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.9rem;
    background: #fdf5f5;
    color: #1a1a1a;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s, background 0.2s;
    margin-bottom: 12px;
  }
  input:focus {
    border-color: #c62828;
    box-shadow: 0 0 0 3px rgba(198,40,40,0.12);
    background: white;
  }

  button {
    width: 100%;
    padding: 12px;
    background: #c62828;
    color: white;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.93rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(198,40,40,0.28);
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
    margin-bottom: 16px;
  }
  button:hover {
    background: #b71c1c;
    box-shadow: 0 5px 16px rgba(198,40,40,0.35);
    transform: translateY(-1px);
  }

  .forgot {
    display: inline-block;
    font-size: 0.85rem;
    color: #c62828;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s, text-decoration 0.2s;
  }
  .forgot:hover { color: #b71c1c; text-decoration: underline; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">👤</div>
  <h2>Donor Login</h2>
  <p class="subtitle">Welcome back! Sign in to your account</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <input name="email" type="email" placeholder="Enter your email" required>
    <input name="password" type="password" placeholder="Enter your password" required>
    <button type="submit">Login →</button>
  </form>

  <a href="/forgot-password" class="forgot">Forgot Password?</a>
</div>
</body>
</html>
