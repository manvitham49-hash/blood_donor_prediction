<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

<title>Verify OTP</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

* { box-sizing: border-box; margin: 0; padding: 0; }

/* 🎯 THEME VARIABLES */
:root {
  --bg: #fdf2f2;
  --text: #1a1a1a;
  --card: #ffffff;
  --input-bg: #fdf5f5;
}

/* 🌙 DARK MODE */
body[data-theme="dark"] {
  --bg: #121212;
  --text: #ffffff;
  --card: #1e1e1e;
  --input-bg: #2a2a2a;
}

/* 🖥️ SYSTEM MODE */
@media (prefers-color-scheme: dark) {
  body[data-theme="system"] {
    --bg: #121212;
    --text: #ffffff;
    --card: #1e1e1e;
    --input-bg: #2a2a2a;
  }
}

/* BODY */
body {
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: var(--text);
}

/* BACKGROUND */
body[data-theme="light"] {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 20%, #fde0e0 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, #fce4e4 0%, transparent 50%);
}

body[data-theme="dark"],
body[data-theme="system"] {
  background: var(--bg);
  background-image:
    radial-gradient(ellipse at 20% 20%, #1a1a1a 0%, transparent 50%),
    radial-gradient(ellipse at 80% 80%, #1f1f1f 0%, transparent 50%);
}

/* CARD */
.box {
  background: var(--card);
  padding: 40px 34px;
  width: 100%;
  max-width: 400px;
  border-radius: 20px;
  border: 1px solid #f0d4d4;
  box-shadow: 0 8px 32px rgba(198,40,40,0.10);
  text-align: center;
}

/* ICON */
.icon {
  width: 60px; height: 60px;
  background: #c62828;
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  font-size: 1.7rem;
  margin: 0 auto 20px;
  box-shadow: 0 6px 18px rgba(198,40,40,0.30);
}

/* TEXT */
h2 { font-size: 1.4rem; font-weight: 700; color: #c62828; margin-bottom: 6px; }

.subtitle { font-size: 0.83rem; color: #888; margin-bottom: 26px; }

/* ERROR */
.error {
  background: #fde8e8;
  color: #c62828;
  border: 1px solid #f5c6c6;
  border-radius: 8px;
  padding: 9px 14px;
  font-size: 0.84rem;
  font-weight: 500;
  margin-bottom: 16px;
  text-align: left;
}

/* OTP INPUT */
input {
  width: 100%;
  padding: 12px 15px;
  border: 1.5px solid #e8d0d0;
  border-radius: 10px;
  font-family: inherit;
  font-size: 1rem;
  background: var(--input-bg);
  color: var(--text);
  outline: none;
  letter-spacing: 6px;
  text-align: center;
  transition: 0.2s;
  margin-bottom: 14px;
}

/* 🔥 FIX WHITE FLASH */
input:focus {
  border-color: #c62828;
  box-shadow: 0 0 0 3px rgba(198,40,40,0.15);
  background: var(--input-bg);
  color: var(--text);
}

/* FORCE TEXT COLOR */
body[data-theme="dark"] input {
  color: #ffffff !important;
}
body[data-theme="light"] input {
  color: #000000 !important;
}

/* PLACEHOLDER */
input::placeholder {
  color: #888;
}

/* BUTTON */
button {
  width: 100%;
  padding: 12px;
  background: #c62828;
  color: white;
  border: none;
  border-radius: 10px;
  font-family: inherit;
  font-size: 0.93rem;
  font-weight: 600;
  cursor: pointer;
  box-shadow: 0 3px 10px rgba(198,40,40,0.28);
  transition: 0.2s;
}

button:hover {
  background: #b71c1c;
  box-shadow: 0 5px 16px rgba(198,40,40,0.35);
  transform: translateY(-1px);
}


</style>
</head>
<body>
<div class="box">
  <div class="icon">📩</div>
  <h2>Verify OTP</h2>
  <p class="subtitle">Enter the OTP sent to your registered email</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <input name="otp" placeholder="· · · · · ·" required>
    <button type="submit">Verify OTP →</button>
  </form>
</div>

<script>
window.onload = function() {
  if (typeof applyTheme === "function") {
    applyTheme();
  }
};
</script>

</body>
</html>
