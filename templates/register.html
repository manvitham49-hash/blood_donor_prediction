<script>
var districts = {
  "Andhra Pradesh":["Anantapur","Chittoor","East Godavari","Guntur","Krishna","Kurnool","Nellore","Prakasam","Srikakulam","Tirupati","Visakhapatnam","Vizianagaram","West Godavari","Kadapa"],
  "Telangana":["Hyderabad","Warangal","Karimnagar","Nizamabad","Khammam","Mahbubnagar","Nalgonda","Adilabad"],
  "Tamil Nadu":["Chennai","Coimbatore","Madurai","Salem","Trichy","Vellore","Tirunelveli"],
  "Maharashtra":["Mumbai","Pune","Nagpur","Nashik","Aurangabad","Thane"],
  "Karnataka":["Bangalore","Mysore","Hubli","Mangalore","Belgaum"],
  "Kerala":["Trivandrum","Kochi","Kozhikode","Thrissur"]
};

function loadDistrict(type){
  var state = document.getElementById(type+"_state").value;
  var box = document.getElementById(type+"_district");
  var otherBox = document.getElementById(type+"_district_other");
  box.innerHTML = "<option value=''>Select District</option>";
  otherBox.style.display = "none";
  if(districts[state]){
    districts[state].forEach(function(d){
      var opt = document.createElement("option");
      opt.value = d; opt.text = d; box.appendChild(opt);
    });
  }
  box.innerHTML += "<option value='Others'>Others</option>";
}

function districtOthers(type){
  var val = document.getElementById(type+"_district").value;
  document.getElementById(type+"_district_other").style.display = (val==="Others") ? "block" : "none";
}

function stateOthers(type){
  var val = document.getElementById(type+"_state").value;
  document.getElementById(type+"_state_other").style.display = (val==="Others") ? "block" : "none";
}

function cityOthers(type){
  var val = document.getElementById(type+"_city").value;
  document.getElementById(type+"_city_other").style.display = (val==="Others") ? "block" : "none";
}

function streetOthers(type){
  var val = document.getElementById(type+"_street").value;
  document.getElementById(type+"_street_other").style.display = (val==="Others") ? "block" : "none";
}

function countryOther(){
  var val = document.getElementById("country_code").value;
  document.getElementById("country_code_other").style.display = (val==="Others") ? "inline-block" : "none";
}

async function detectLocation(pin, type){
  if(pin.length != 6) return;
  let response = await fetch("https://api.postalpincode.in/pincode/"+pin);
  let data = await response.json();
  if(data[0].Status=="Success"){
    let postOffices = data[0].PostOffice;
    let cityBox = document.getElementById(type+"_city");
    cityBox.innerHTML = "<option value=''>Select City</option>";
    let cities = new Set();
    postOffices.forEach(p => cities.add(p.District));
    cities.forEach(city => {
      let opt = document.createElement("option");
      opt.value = city; opt.text = city; cityBox.appendChild(opt);
    });
    cityBox.innerHTML += "<option value='Others'>Others</option>";
    let streetBox = document.getElementById(type+"_street");
    streetBox.innerHTML = "<option value=''>Select Area</option>";
    let areas = new Set();
    postOffices.forEach(p => areas.add(p.Name));
    areas.forEach(area => {
      let opt = document.createElement("option");
      opt.value = area; opt.text = area; streetBox.appendChild(opt);
    });
    streetBox.innerHTML += "<option value='Others'>Others</option>";
  }
}


async function sameAddress(){
  let isChecked = document.getElementById("same").checked;

  if(isChecked){

    // ===== STATE =====
    let permState = document.getElementById("permanent_state").value;
    let currState = document.getElementById("current_state");
    if (![...currState.options].some(opt => opt.value === permState)) {
        let opt = document.createElement("option");
        opt.value = permState;
        opt.text = permState;
        currState.appendChild(opt);
    }

    currState.value = permState;

    // 🔥 trigger UI
    stateOthers("current");

    if(permState === "Others"){
      let val = document.getElementById("permanent_state_other").value;
      document.getElementById("current_state_other").value = val;
    } else {
      loadDistrict("current");
    }

    // ===== DISTRICT =====
    let permDistrict = document.getElementById("permanent_district").value;
    let districtBox = document.getElementById("current_district");

    if (![...districtBox.options].some(opt => opt.value === permDistrict)) {
      let opt = document.createElement("option");
      opt.value = permDistrict;
      opt.text = permDistrict;
      districtBox.appendChild(opt);
    }

    districtBox.value = permDistrict;

    // 🔥 trigger UI
    districtOthers("current");

    if(permDistrict === "Others"){
      let val = document.getElementById("permanent_district_other").value;
      document.getElementById("current_district_other").value = val;
      document.getElementById("current_district").value = "Others";
      districtOthers("current");
    }

    // ===== PINCODE =====
    let pin = document.getElementById("permanent_pincode").value;
    document.getElementById("current_pincode").value = pin;

    // ===== CITY + STREET (🔥 FIXED) =====

    // 🔥 ALWAYS use pincode (remove dependency on state)
    if(pin.length === 6){
      await detectLocation(pin, "current");
    }

    // ---------- CITY ----------
    let permCity = document.getElementById("permanent_city").value;

    if (permCity === "Others") {
        document.getElementById("current_city").value = "Others";
        cityOthers("current");

        document.getElementById("current_city_other").value =
            document.getElementById("permanent_city_other").value;

    } else {
        let cityBox = document.getElementById("current_city");

        if (![...cityBox.options].some(opt => opt.value === permCity)) {
            let opt = document.createElement("option");
            opt.value = permCity;
            opt.text = permCity;
            cityBox.appendChild(opt);
        }

        cityBox.value = permCity;
        cityOthers("current");
    }

    // ---------- STREET ----------
    let permStreet = document.getElementById("permanent_street").value;

    if (permStreet === "Others") {
        document.getElementById("current_street").value = "Others";
        streetOthers("current");

        document.getElementById("current_street_other").value =
            document.getElementById("permanent_street_other").value;

    } else {
        let streetBox = document.getElementById("current_street");

        if (![...streetBox.options].some(opt => opt.value === permStreet)) {
            let opt = document.createElement("option");
            opt.value = permStreet;
            opt.text = permStreet;
            streetBox.appendChild(opt);
        }

        streetBox.value = permStreet;
        streetOthers("current");
    }

  } else {

    // ===== RESET VALUES =====
    document.getElementById("current_state").value = "";
    document.getElementById("current_district").innerHTML =
      "<option value=''>Select District</option>";

    document.getElementById("current_pincode").value = "";

    document.getElementById("current_city").innerHTML =
      "<option value=''>Select City</option><option value='Others'>Others</option>";

    document.getElementById("current_street").innerHTML =
      "<option value=''>Select Area</option><option value='Others'>Others</option>";

    // hide "Others" inputs
    document.getElementById("current_state_other").style.display = "none";
    document.getElementById("current_district_other").style.display = "none";
    document.getElementById("current_city_other").style.display = "none";
    document.getElementById("current_street_other").style.display = "none";

    // clear values
    document.getElementById("current_state_other").value = "";
    document.getElementById("current_district_other").value = "";
    document.getElementById("current_city_other").value = "";
    document.getElementById("current_street_other").value = "";
  }
}



function calculateAge(){
  var dob = document.getElementById("dob").value;
  if(!dob) return;

  var birthDate = new Date(dob);
  var today = new Date();

  var age = today.getFullYear() - birthDate.getFullYear();
  var monthDiff = today.getMonth() - birthDate.getMonth();

  if(monthDiff < 0 || (monthDiff === 0 && today.getDate() < birthDate.getDate())){
    age--;
  }

  // ✅ SET AGE
  document.getElementById("current_age").value = age;
  document.getElementById("reg_age").value = age;

  // 🔴 AGE VALIDATION
  if(age < 18 || age > 65){
    alert("❌ You must be between 18 and 65 years to register as a donor");

    // clear fields
    document.getElementById("dob").value = "";
    document.getElementById("current_age").value = "";
    document.getElementById("reg_age").value = "";
  }
}


function calculateDaysSinceDonation() {

  var donationDate = document.getElementById("last_donation").value;

  if(!donationDate) return;

  var today = new Date();
  var lastDate = new Date(donationDate);

  var diffTime = today - lastDate;
  var diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));

  document.getElementById("days_since_last_donation").value = diffDays;
}


function handleRegistration(event) {
  var age = document.getElementById("current_age").value;

  if(age < 18 || age > 65){
    alert("❌ Age must be between 18 and 65");
    event.preventDefault();
    return;
  }

  event.preventDefault();
  document.getElementById("popup").style.display = "flex";
  setTimeout(() => { event.target.submit(); }, 2000);
}

function goHome(){ window.location.href = "/login"; }
</script>

          <option value="Others">Others</option>
        </select>
        <input id="current_state_other" name="current_state_other" placeholder="Enter State" style="display:none; margin-top:8px;">
      </div>
      <div>
        <label>District</label>
        <select name="current_district" id="current_district" onchange="districtOthers('current')">
          <option value="">Select District</option>
        </select>
        <input id="current_district_other" name="current_district_other" placeholder="Enter District" style="display:none; margin-top:8px;">
      </div>
      <div>
        <label>Pincode</label>
        <input name="current_pincode" id="current_pincode" placeholder="6-digit pincode" onkeyup="detectLocation(this.value,'current')">
      </div>
      <div>
        <label>City</label>
        <select name="current_city" id="current_city" onchange="cityOthers('current')">
          <option value="">Select City</option>
          <option value="Others">Others</option>
        </select>
        <input id="current_city_other" name="current_city_other" placeholder="Enter City" style="display:none; margin-top:8px;">
      </div>
      <div class="full">
        <label>Street / Area / House No</label>
        <select name="current_street" id="current_street" onchange="streetOthers('current')">
          <option value="">Select Area</option>
          <option value="Others">Others</option>
        </select>
        <input id="current_street_other" name="current_street_other" placeholder="Enter Street / Area / House No" style="display:none; margin-top:8px;">
      </div>
    </div>

    <!-- Blood Details -->
    <div class="section-heading">🩸 Blood Details</div>
    <div class="grid three">
      <div>
        <label>Blood Group</label>
        <select name="blood_group" required>
          <option value="">Select Blood Group</option>
          <option>A+</option><option>A-</option><option>B+</option><option>B-</option>
          <option>AB+</option><option>AB-</option><option>O+</option><option>O-</option>
        </select>
      </div>
      <div>
        <label>Availability</label>
        <select name="availability">
          <option value="">Select</option>
          <option>Yes</option><option>No</option>
        </select>
      </div>
      <div>
        <label>Months Since First Donation</label>
        <input name="months" type="number" placeholder="e.g. 12" required>
      </div>
      <div>
        <label>Number of Donations</label>
        <input name="donations" type="number" placeholder="e.g. 3" required>
      </div>
      <div>
        <label>Pints Donated</label>
        <input name="pints" type="number" step="0.1" placeholder="e.g. 1.5" required>
      </div>
      <div>
        <label>Haemoglobin (g/dL)</label>
       <input name="haemoglobin" type="number" step="0.1" placeholder="e.g. 13.5" required>     
      </div>

      <div>
        <label>Platelets Count</label>
        <input name="platelets" type="number" placeholder="e.g. 250000" required>
      </div>

      <div>
        <label>Blood Pressure</label>
        <input name="blood_pressure" placeholder="e.g. 120/80" required>
      </div>

      <div>
        <label>Gender</label>
        <select name="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
        </select>
      </div>

      <div>
        <label>Last Blood Donation Date</label>
        <input type="date"
               id="last_donation"
               name="last_blood_donation_date"
               onchange="calculateDaysSinceDonation()"
               required>
      </div>

      <div>
        <label>Days Since Last Donation</label>
        <input id="days_since_last_donation" readonly placeholder="Auto calculated">
      </div>
      
    </div>
    

    <!-- Buttons -->
    <div class="btn-row">
      <button type="submit" class="btn-submit">🩸 Register Now</button>
      <button type="button" class="btn-exit" onclick="goHome()">✕ Exit</button>
    </div>

  </form>
</div>

<script>
window.onload = function() {
  if (typeof applyTheme === "function") {
    applyTheme();
  }
};
</script>


</body>
</html>
