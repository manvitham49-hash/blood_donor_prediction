<!DOCTYPE html>
<html>
<head>

<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<title>Admin Verification</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    background: #fdf2f2;
    background-image:
      radial-gradient(ellipse at 20% 20%, #fde0e0 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #fce4e4 0%, transparent 50%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .box {
    background: white;
    padding: 36px 32px;
    width: 100%;
    max-width: 400px;
    border-radius: 16px;
    border: 1px solid #f0d4d4;
    box-shadow: 0 8px 32px rgba(198,40,40,0.10);
    text-align: center;
  }

  .icon {
    width: 56px; height: 56px;
    background: #c62828;
    border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    margin: 0 auto 18px;
    box-shadow: 0 4px 14px rgba(198,40,40,0.30);
  }

  h2 {
    font-size: 1.3rem;
    font-weight: 700;
    color: #b71c1c;
    margin-bottom: 6px;
  }

  .subtitle {
    font-size: 0.82rem;
    color: #aaa;
    margin-bottom: 24px;
  }

  .error {
    background: #fde8e8;
    color: #c62828;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.84rem;
    font-weight: 500;
    margin-bottom: 16px;
    text-align: left;
  }

  input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e8d0d0;
    border-radius: 9px;
    font-family: inherit;
    font-size: 0.9rem;
    background: #fdf5f5;
    color: #1a1a1a;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s;
    margin-bottom: 14px;
  }
  input[type="password"]:focus {
    border-color: #c62828;
    box-shadow: 0 0 0 3px rgba(198,40,40,0.10);
    background: white;
  }

  button {
    width: 100%;
    padding: 11px;
    background: #c62828;
    color: white;
    border: none;
    border-radius: 9px;
    font-family: inherit;
    font-size: 0.92rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(198,40,40,0.28);
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  button:hover {
    background: #b71c1c;
    box-shadow: 0 5px 16px rgba(198,40,40,0.35);
    transform: translateY(-1px);
  }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔐</div>
  <h2>Admin Verification</h2>
  <p class="subtitle">Enter your password to access the dashboard</p>

  {% if error %}
  <div class="error">⚠️ {{ error }}</div>
  {% endif %}

  <form method="POST">
    <input type="password" name="admin_password" placeholder="Enter Admin Password" required>
    <button type="submit">Verify & Continue →</button>
  </form>
</div>
</body>
</html>
