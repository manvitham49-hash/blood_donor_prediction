<!DOCTYPE html>
<html>
<head>

<script>
window.onload = function () {
    applyTheme();
};
</script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>

<title>Admin Login</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ===== DARK MODE FIX ===== */

body[data-theme="dark"] {
  background: #121212;
  color: white;
}

/* BOX */
body[data-theme="dark"] .box {
  background: #1e1e1e;
  border-color: #333;
  color: white;
}

/* INPUT */
body[data-theme="dark"] input {
  background: #2a2a2a;
  color: white;
  border-color: #444;
}

/* LABEL */
body[data-theme="dark"] .field label {
  color: #bbb;
}

/* TITLE */
body[data-theme="dark"] h2 {
  color: #ff6b6b;
}

/* ERROR BOX */
body[data-theme="dark"] .error {
  background: #3a1f1f;
  border-color: #5c2a2a;
  color: #ff6b6b;
}

/* LINKS */
body[data-theme="dark"] .links a {
  color: #ff6b6b;
}

body[data-theme="dark"] .links .back {
  color: #bbb;
}



  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: transparent;
    background-image:
      radial-gradient(ellipse at 20% 20%, #fde0e0 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #fce4e4 0%, transparent 50%);
  }

  .box {
    background: white;
    border-radius: 20px;
    border: 1px solid #f0d4d4;
    box-shadow: 0 8px 32px rgba(198,40,40,0.10);
    padding: 40px 34px;
    width: 100%;
    max-width: 400px;
    text-align: center;
  }

  .icon {
    width: 60px; height: 60px;
    background: #c62828;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.7rem;
    margin: 0 auto 18px;
    box-shadow: 0 6px 18px rgba(198,40,40,0.30);
  }

  h2 { font-size: 1.4rem; font-weight: 700; color: #b71c1c; margin-bottom: 6px; }
  .subtitle { font-size: 0.83rem; color: #aaa; margin-bottom: 26px; }

  .error {
    background: #fde8e8;
    color: #c62828;
    border: 1px solid #f5c6c6;
    border-radius: 8px;
    padding: 9px 14px;
    font-size: 0.84rem;
    font-weight: 500;
    margin-bottom: 16px;
    text-align: left;
  }

  .field { margin-bottom: 14px; text-align: left; }
  .field label {
    display: block;
    font-size: 0.76rem;
    font-weight: 600;
    color: #999;
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 5px;
  }

  input {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid #e8d0d0;
    border-radius: 9px;
    font-family: inherit;
    font-size: 0.9rem;
    background: #fdf5f5;
    color: #1a1a1a;
    outline: none;
    transition: border 0.2s, box-shadow 0.2s, background 0.2s;
  }
  input:focus {
    border-color: #c62828;
    box-shadow: 0 0 0 3px rgba(198,40,40,0.12);
    background: white;
  }

  button {
    width: 100%;
    padding: 12px;
    background: #c62828;
    color: white;
    border: none;
    border-radius: 10px;
    font-family: inherit;
    font-size: 0.93rem;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
    box-shadow: 0 3px 10px rgba(198,40,40,0.28);
    transition: background 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  button:hover {
    background: #b71c1c;
    box-shadow: 0 5px 16px rgba(198,40,40,0.35);
    transform: translateY(-1px);
  }

  .links {
    margin-top: 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    font-size: 0.84rem;
    color: #aaa;
  }
  .links a {
    color: #c62828;
    text-decoration: none;
    font-weight: 500;
    transition: color 0.2s, text-decoration 0.2s;
  }
  .links a:hover { color: #b71c1c; text-decoration: underline; }
  .links .back { color: #999; }
  .links .back:hover { color: #555; }
</style>
</head>
<body>
<div class="box">
  <div class="icon">🔐</div>
  <h2>Admin Login</h2>
  <p class="subtitle">Sign in to access the dashboard</p>

  {% if error %}<div class="error">⚠️ {{ error }}</div>{% endif %}

  <form method="POST">
    <div class="field"><label>Email</label><input type="email" name="email" placeholder="admin@example.com" required></div>
    <div class="field"><label>Password</label><input type="password" name="password" placeholder="••••••••" required></div>
    <button type="submit">Sign In →</button>
  </form>

  <div class="links">
    <a href="/admin-forgot-password">Forgot Password?</a>
    <span>Not an admin? <a href="/login">Login as Donor</a></span>
    <a href="/" class="back">← Back to Login Options</a>
  </div>
</div>
</body>
</html>
