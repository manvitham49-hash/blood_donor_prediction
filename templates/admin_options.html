<!DOCTYPE html>
<html>
<head>

<script>
window.onload = function () {
    applyTheme();
};
</script>

<link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
<title>Admin Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

/* ===== DARK MODE ===== */

body[data-theme="dark"] {
  background: #121212;
  color: white;
}

/* PANEL */
body[data-theme="dark"] .panel {
  background: #1e1e1e;
  border-color: #333;
}

/* HEADER */
body[data-theme="dark"] .panel-head {
  border-bottom: 1px solid #333;
}

body[data-theme="dark"] .panel-head h1 {
  color: #ff6b6b;
}

body[data-theme="dark"] .panel-head p {
  color: #bbb;
}

/* NAV LINKS */
body[data-theme="dark"] .nav a {
  background: #2a2a2a;
  border-color: #444;
}

body[data-theme="dark"] .nav a:hover {
  background: #333;
}

/* TEXT */
body[data-theme="dark"] .nav a .txt strong {
  color: white;
}

body[data-theme="dark"] .nav a .txt span {
  color: #bbb;
}

/* ICON BG */
body[data-theme="dark"] .ico.red,
body[data-theme="dark"] .ico.pink {
  background: #3a1f1f;
}

/* LOGOUT BUTTON */
body[data-theme="dark"] .nav-foot a {
  background: #2a2a2a;
  color: #ff6b6b;
  border-color: #444;
}

body[data-theme="dark"] .nav-foot a:hover {
  background: #c62828;
  color: white;
}


  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: transparent;
    background-image:
      radial-gradient(ellipse at 20% 20%, #fde0e0 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, #fce4e4 0%, transparent 50%);
  }

  .panel {
    background: white;
    border-radius: 20px;
    border: 1px solid #f0d4d4;
    box-shadow: 0 8px 32px rgba(198,40,40,0.10);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }

  .panel-head {
    padding: 32px 32px 24px;
    border-bottom: 1px solid #fde8e8;
    text-align: center;
  }
  .panel-head .icon {
    width: 60px; height: 60px;
    background: #c62828;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem;
    margin: 0 auto 16px;
    box-shadow: 0 6px 18px rgba(198,40,40,0.30);
  }
  .panel-head h1 { font-size: 1.2rem; font-weight: 700; color: #b71c1c; }
  .panel-head p  { font-size: 0.82rem; color: #aaa; margin-top: 4px; }

  .nav { padding: 16px; }

  .nav a {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 12px;
    text-decoration: none;
    background: #fdf5f5;
    border: 1.5px solid #f0d4d4;
    margin-bottom: 10px;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }
  .nav a:hover {
    background: white;
    border-color: #c62828;
    box-shadow: 0 4px 14px rgba(198,40,40,0.12);
    transform: translateX(3px);
  }

  .nav a .ico {
    width: 40px; height: 40px;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem;
    flex-shrink: 0;
  }
  .ico.red    { background: #fee2e2; }
  .ico.pink   { background: #fde8e8; }

  .nav a .txt { flex: 1; }
  .nav a .txt strong {
    display: block;
    font-size: 0.9rem;
    font-weight: 700;
    color: #1a1a1a;
  }
  .nav a .txt span {
    display: block;
    font-size: 0.76rem;
    color: #aaa;
    margin-top: 2px;
  }

  .nav a .arr {
    color: #e8c0c0;
    font-size: 1.2rem;
    font-weight: 700;
    transition: color 0.2s;
  }
  .nav a:hover .arr { color: #c62828; }

  .nav-foot { padding: 0 16px 16px; }
  .nav-foot a {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 13px;
    border-radius: 12px;
    text-decoration: none;
    background: #fde8e8;
    color: #c62828;
    font-size: 0.88rem;
    font-weight: 600;
    border: 1.5px solid #f5c6c6;
    transition: background 0.2s, border-color 0.2s, color 0.2s;
  }
  .nav-foot a:hover {
    background: #c62828;
    color: white;
    border-color: #c62828;
  }
</style>
</head>
<body>
  <div class="panel">
    <div class="panel-head">
      <div class="icon">🛡️</div>
      <h1>Admin Dashboard</h1>
      <p>Manage donors and predictions</p>
    </div>

    <div class="nav">
      <a href="/admin-predict">
        <div class="ico red">🔍</div>
        <div class="txt">
          <strong>Search Donor Availability</strong>
          <span>Find Available Donors By Filtering Current City & Blood Group</span>
        </div>
        <span class="arr">›</span>
      </a>
      <a href="/admin-donors">
        <div class="ico pink">👥</div>
        <div class="txt">
          <strong>View Donors</strong>
          <span>Browse and Updates Donor Details</span>
        </div>
        <span class="arr">›</span>
      </a>
    </div>

    <div class="nav-foot">
      <a href="/admin-logout">⎋ &nbsp;Sign Out</a>
    </div>
  </div>
</body>
</html>
